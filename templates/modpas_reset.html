{% extends "base.html" %}
{% block title %}Chanje Modpas — Mache Yogann{% endblock %}

{% block content %}
<section class="auth-wrap">
  <div class="form-card auth-card">
    <h2>Chwazi yon nouvo modpas</h2>
    <form method="POST" action="{{ url_for('modpas_reset', token=token) }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label>Nouvo modpas
        <input type="password" name="password" required minlength="6" placeholder="Omwen 6 karaktè">
      </label>
      <button type="submit" class="btn btn-primary btn-block">Chanje modpas</button>
    </form>
  </div>
</section>
{% endblock %}
